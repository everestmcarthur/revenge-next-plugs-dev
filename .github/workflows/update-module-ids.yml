name: Update Discord Module IDs (Daily & Manual)

on:
    schedule:
        - cron: "0 12 * * *" # Runs daily at 12:00 UTC
    workflow_dispatch:
        inputs:
            force_build:
                description: "Package all plugins and deploy even if module IDs did not change"
                required: false
                default: false
                type: boolean

concurrency:
    group: module-ids-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    update-modules:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "25"

            - name: Install JS dependencies
              run: bun install

            - name: Update Discord module IDs
              id: update_step
              run: |
                  output=$(bun scripts/update-discord-module-ids.mjs)
                  echo "$output"
                  if echo "$output" | grep -q "Updated discord-modules.ts"; then
                      echo "changed=true" >> $GITHUB_OUTPUT
                  else
                      echo "changed=false" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push updated module IDs & version bumps
              if: steps.update_step.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add plugins/shared/discord-modules.ts plugins/*/manifest.json
                  git commit -m "chore: update Discord module IDs to latest build"
                  git push

            - name: Publish Revenge plugin API to local Maven
              if: steps.update_step.outputs.changed == 'true' || inputs.force_build == true
              run: |
                  git clone --depth 1 https://github.com/revenge-mod/revenge-xposed.git /tmp/revenge-xposed
                  cd /tmp/revenge-xposed
                  ./gradlew :api:publishToMavenLocal

            - name: Package all plugins
              if: steps.update_step.outputs.changed == 'true' || inputs.force_build == true
              run: ./gradlew packageAllPlugins -PjsToolPath="$(which bun)"

            - name: Generate repository index
              if: steps.update_step.outputs.changed == 'true' || inputs.force_build == true
              run: bun run generate-index -- --dist build/dist --base-url https://dev-next.jarviscli.dev --out build/dist/index.json

            - name: Deploy to Cloudflare Workers
              if: (steps.update_step.outputs.changed == 'true' || inputs.force_build == true) && env.CLOUDFLARE_API_TOKEN != ''
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: bunx wrangler deploy

            - name: Verify deployed index and artifact integrity
              if: (steps.update_step.outputs.changed == 'true' || inputs.force_build == true) && env.CLOUDFLARE_API_TOKEN != ''
              env:
                  VERIFY_BASE_URL: https://dev-next.jarviscli.dev
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: bun .github/scripts/verify-deploy.mjs
